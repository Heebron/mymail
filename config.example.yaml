# This is a single-instance configuration example. For a split deployment,
# see config-split-local.yaml and config-split-remote.yaml.
# SMTP submission always requires STARTTLS before authentication or submission.
smtp_listen: 0.0.0.0:587
# Optional inbound SMTP listener, normally used for port 25. It accepts
# ordinary mail without TLS and requires STARTTLS before advertising AUTH.
smtp_cleartext_listen: 0.0.0.0:25
# Optional implicit-TLS SMTP submission listener, normally used for port 465.
smtp_tls_listen: 0.0.0.0:465
imap_listen: 0.0.0.0:1143
health_listen: 0.0.0.0:8080
# Certificate files enable STARTTLS on smtp_listen and imap_listen, and TLS on
# smtp_tls_listen and imap_tls_listen.
tls_cert_file: /etc/mymail/tls.crt
tls_key_file: /etc/mymail/tls.key
# Require STARTTLS before IMAP authentication.
imap_require_starttls: true
# IMAP may additionally use an implicit TLS listener.
# imap_tls_listen: 0.0.0.0:993
# Authentication throttling is shared by SMTP and IMAP listeners. Omit this
# section, or an individual setting, to use the default shown here. Duration
# values use Go syntax such as 1s or 15m.
auth_throttle:
  # Maximum authentication checks allowed on one SMTP or IMAP connection.
  max_attempts_per_connection: 5
  # Failed authentications tracked per source IP within failure_window.
  max_failures_per_ip: 20
  # Failed authentications tracked per account across all source IPs.
  max_failures_per_account: 10
  # Initial delay after a failed authentication; later delays grow
  # exponentially until backoff_max.
  backoff_base: 1s
  # Largest authentication delay; must be at least backoff_base.
  backoff_max: 1m
  # Maximum time to delay a failed-authentication response. This is separate
  # from backoff_max so failed connections are never held for the full lockout.
  response_delay_max: 1s
  # Time without a failure before IP and account failure state expires.
  failure_window: 15m
# Values may use environment variables, for example: ${HOME}/mymail
maildir_root: /mnt/probox/@email
# Hostname used in protocol greetings and outbound SMTP EHLO.
hostname: mail.example.test
# Network for outbound MX relays: tcp (default), tcp4, or tcp6. Use tcp4 or
# tcp6 when only that address family has correctly configured reverse DNS.
# smtp_relay_network: tcp4
# DKIM signing for outgoing emails. When domain, private_key, public_key, and
# selector are all configured, MyMail adds a DKIM-Signature header to outgoing
# messages before forwarding them to destination MX hosts.
# dkim:
#   # Domain used in DKIM signatures for outgoing email.
#   domain: example.test
#   # Private key (or file path) used to sign outgoing email (alias: private_key_file).
#   private_key: /etc/mymail/dkim.key
#   # Public key (or file path / DNS TXT record) for DKIM configuration (alias: public_key_file).
#   public_key: /etc/mymail/dkim.pub
#   # Selector name used in DKIM signatures.
#   selector: default
# Plugins are initialized in list order. Each item names one plugin and may
# supply string settings; setting values may use ${ENV_VAR} expansion.
# Uncomment this block to enable SpamAssassin filtering and Bayes training via spamd.
# When enabled:
#  - Regular incoming messages are scanned and tagged with SpamAssassin headers.
#  - Users can train SpamAssassin as spam or ham by forwarding messages to any
#    of their account addresses or aliases prefixed with 'spam-' or 'ham-'
#    (e.g., spam-user-4821@mail.example.test, ham-barb@example.test).
#  - Forwarded emails in training messages are submitted to spamd for learning,
#    and a detailed training report is delivered to the user's inbox.
#  - Put dmarc before spamd and whitelist only the recipients that should receive
#    summarized reports. A recognized report stops the chain before spamd;
#    ordinary or invalid messages continue to spamd.
# plugins:
#   - name: dmarc
#     whitelist:
#       - ken@thepratts.us
#     config:
#       max_report_size: 10485760
#       max_message_size: 26214400
#   - name: spamd
#     config:
#       address: 127.0.0.1:783
#       # Omit user for per-mailbox SpamAssassin configuration. MyMail sends
#       # the resolved mailbox name in the SPAMC User header for each delivery.
#       timeout: 30s
#       max_message_size: 10485760
# Authenticated sessions may forward recipients at other domains to their MX host.
# Note: Any configured user address or alias automatically supports 'spam-' and
# 'ham-' prefixes for spam/ham training without requiring additional alias entries.
users:
  user-4821@mail.example.test:
    # Generate with mymail-password and provide through the daemon environment.
    password_hash: ${MYMAIL_USER_4821_PASSWORD_HASH}
    mailbox: user-4821
    aliases:
      - alias-7f2@example.test
      - alias-19c@example.test
      - alias-4a8@example.test
      - barb@example.test
      - barb@service.example.test   # different sub-domain
      - barb@personal.test          # completely different domain
  bob@mail.example.test:
    password_hash: ${MYMAIL_BOB_PASSWORD_HASH}
    mailbox: bob