apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mymail-storage
  labels:
    app.kubernetes.io/name: mymail
    app.kubernetes.io/instance: mymail
    app.kubernetes.io/component: storage
  annotations:
    nfs.io/storage-path: "nexus-storage"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1000Gi
  storageClassName: nfs-client
  volumeMode: Filesystem
