apiVersion: v1
kind: Service
metadata:
  name: mymail
  labels:
    app.kubernetes.io/name: mymail
    app.kubernetes.io/instance: mymail
    app.kubernetes.io/component: mail-server
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  ports:
    - name: smtp
      protocol: TCP
      port: 25
      targetPort: smtp
    - name: submission
      protocol: TCP
      port: 587
      targetPort: submission
    - name: imap
      protocol: TCP
      port: 143
      targetPort: imap
    - name: imaps
      protocol: TCP
      port: 993
      targetPort: imaps
  selector:
    app.kubernetes.io/name: mymail
    app.kubernetes.io/instance: mymail
