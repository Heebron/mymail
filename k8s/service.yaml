apiVersion: v1
kind: Service
metadata:
  name: mymail
spec:
  selector:
    app: mymail
  ports:
    - name: smtp
      protocol: TCP
      port: 25
      targetPort: 25
    - name: smtps
      protocol: TCP
      port: 587
      targetPort: 587
    - name: imap
      protocol: TCP
      port: 143
      targetPort: 143
    - name: imaps
      protocol: TCP
      port: 993
      targetPort: 993
  type: LoadBalancer
  externalTrafficPolicy: Local
