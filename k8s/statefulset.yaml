apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mymail
  labels:
    app.kubernetes.io/name: mymail
    app.kubernetes.io/instance: mymail
    app.kubernetes.io/component: mail-server
spec:
  replicas: 1
  serviceName: mymail-headless
  selector:
    matchLabels:
      app.kubernetes.io/name: mymail
      app.kubernetes.io/instance: mymail
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mymail
        app.kubernetes.io/instance: mymail
        app.kubernetes.io/component: mail-server
    spec:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      enableServiceLinks: false
      terminationGracePeriodSeconds: 180
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: mymail-storage
          persistentVolumeClaim:
            claimName: mymail-storage
      initContainers:
        - name: set-storage-permissions
          image: busybox:1.36
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          command:
            - /bin/sh
            - -c
            - >-
              chown -R 10001:10001 /mymail-data &&
              find /mymail-data -type d -exec chmod 700 {} + &&
              find /mymail-data -type f -exec chmod 600 {} +
          volumeMounts:
            - name: mymail-storage
              mountPath: /mymail-data
      containers:
        - name: mymail
          image: nexus.thepratts.info/pratt-registry/pratt/mymail
          imagePullPolicy: Always
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
          ports:
            - containerPort: 25
              name: smtp
            - containerPort: 587
              name: submission
            - containerPort: 465
              name: submissions
            - containerPort: 143
              name: imap
            - containerPort: 993
              name: imaps
            - containerPort: 8080
              name: health
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: mymail-storage
              mountPath: /mymail-data
          args: ["-config", "/mymail-data/config.yaml"]
        - name: spamd
          image: nexus.thepratts.info/pratt-registry/pratt/mymail-spamd:latest
          imagePullPolicy: Always
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - KILL
                - SETGID
                - SETUID
          ports:
            - containerPort: 783
              name: spamd
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - >-
                  grep -Eq
                  '^[[:space:]]*[0-9]+:[[:space:]]+[0-9A-Fa-f]+:030F[[:space:]]+[0-9A-Fa-f]+:[0-9A-Fa-f]+[[:space:]]+0A([[:space:]]|$)'
                  /proc/net/tcp
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - >-
                  grep -Eq
                  '^[[:space:]]*[0-9]+:[[:space:]]+[0-9A-Fa-f]+:030F[[:space:]]+[0-9A-Fa-f]+:[0-9A-Fa-f]+[[:space:]]+0A([[:space:]]|$)'
                  /proc/net/tcp
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: mymail-storage
              mountPath: /mymail-data
