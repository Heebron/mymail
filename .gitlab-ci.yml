stages:
  - image

workflow:
  rules:
    - if: '$CI_COMMIT_TAG'
    - when: never

build-and-push-image:
  stage: image
  image: docker:27
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
  script:
    - docker build --build-arg VERSION="$CI_COMMIT_TAG" --build-arg BUILT_ON="$(date -u +%Y-%m-%dT%H:%M:%SZ)" --tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
  rules:
    - if: '$CI_COMMIT_TAG'